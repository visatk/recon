<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ReconBox Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Adapt to Telegram Native Theme */
        body {
            background-color: var(--tg-theme-bg-color, #18181b);
            color: var(--tg-theme-text-color, #ffffff);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #27272a);
        }
        .text-hint {
            color: var(--tg-theme-hint-color, #a1a1aa);
        }
        .btn-primary {
            background-color: var(--tg-theme-button-color, #3b82f6);
            color: var(--tg-theme-button-text-color, #ffffff);
        }
    </style>
</head>
<body class="p-4 antialiased">

    <div id="loader" class="flex flex-col items-center justify-center mt-20">
        <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-blue-500 mb-4"></div>
        <p class="text-hint">Authenticating via Telegram...</p>
    </div>

    <div id="dashboard" class="hidden">
        <div class="flex items-center space-x-3 mb-6">
            <div id="avatar" class="w-12 h-12 rounded-full bg-blue-500 flex items-center justify-center text-xl font-bold"></div>
            <div>
                <h1 class="text-xl font-bold" id="username">Loading...</h1>
                <p class="text-hint text-sm uppercase tracking-wide" id="tier">Tier: --</p>
            </div>
        </div>

        <div class="card rounded-xl p-5 mb-6 shadow-lg border border-gray-700/50">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-lg font-semibold">Available Credits</h2>
                <span class="text-2xl font-bold text-blue-400" id="credits">0</span>
            </div>
            <p class="text-hint text-xs">Credits reset automatically every 24 hours.</p>
            <button class="btn-primary w-full mt-4 py-3 rounded-lg font-bold shadow-md active:scale-95 transition-transform" onclick="WebApp.close()">
                RUN NEW SCAN
            </button>
        </div>

        <h2 class="text-lg font-semibold mb-3">Recent Scans</h2>
        <div id="scan-list" class="space-y-3">
            </div>
    </div>

    <script>
        const WebApp = window.Telegram.WebApp;
        WebApp.ready();
        WebApp.expand();

        async function fetchDashboardData() {
            const initData = WebApp.initData;
            
            try {
                // Securely fetch data using TMA auth
                const response = await fetch('/api/user', {
                    method: 'GET',
                    headers: {
                        'Authorization': `tma ${initData}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) throw new Error('Auth failed');
                const data = await response.json();
                
                renderDashboard(data);
            } catch (error) {
                WebApp.showAlert('Failed to authenticate. Please restart the bot.');
            }
        }

        function renderDashboard(data) {
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            const profile = data.profile;
            document.getElementById('username').innerText = profile.username;
            document.getElementById('avatar').innerText = profile.username.charAt(0).toUpperCase();
            document.getElementById('tier').innerText = `Tier: ${profile.tier}`;
            document.getElementById('credits').innerText = profile.credits;

            const scanList = document.getElementById('scan-list');
            if (data.scans && data.scans.length > 0) {
                scanList.innerHTML = data.scans.map(scan => `
                    <div class="card rounded-lg p-3 border border-gray-700/50 flex justify-between items-center">
                        <div>
                            <p class="font-semibold text-sm">${scan.target}</p>
                            <p class="text-hint text-xs mt-1">Tool: ${scan.tool}</p>
                        </div>
                        <span class="text-xs px-2 py-1 rounded-full ${scan.status === 'completed' ? 'bg-green-500/20 text-green-400' : (scan.status === 'failed' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400')}">
                            ${scan.status.toUpperCase()}
                        </span>
                    </div>
                `).join('');
            } else {
                scanList.innerHTML = `<p class="text-hint text-sm text-center py-4">No scans found.</p>`;
            }
        }

        // Initialize
        fetchDashboardData();
    </script>
</body>
</html>
